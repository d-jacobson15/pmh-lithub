  <script src="content.js"></script>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const group = document.getElementById('issueNodes');

    literacyIssues.forEach(issue => {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', `issue-node ${issue.type}`);
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'link');
      g.setAttribute('aria-label', issue.title);
      g.addEventListener('click', () => location.href = `issue.html?id=${issue.slug}`);
      g.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') location.href = `issue.html?id=${issue.slug}`;
      });

      const width = Math.max(124, issue.title.length * 8 + 24);
      const yOffset = issue.type === 'foundational' ? -14 : -39;
      const labelY = issue.y + yOffset;

      const labelBg = document.createElementNS(NS, 'rect');
      labelBg.setAttribute('x', issue.x - width / 2);
      labelBg.setAttribute('y', labelY);
      labelBg.setAttribute('width', width);
      labelBg.setAttribute('height', 28);
      labelBg.setAttribute('rx', 4);

      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', issue.x);
      text.setAttribute('y', labelY + 19);
      text.setAttribute('text-anchor', 'middle');
      text.textContent = issue.title;

      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', issue.x - width / 2 - 14);
      circle.setAttribute('cy', labelY + 14);
      circle.setAttribute('r', '7');

      g.append(labelBg, text, circle);
      group.appendChild(g);
    });
  </script>
