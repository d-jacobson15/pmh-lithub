<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="PMH LitHub">
  <title>PMH LitHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <main class="home-wrap">
    <h1>PMH LitHub</h1>

    <section class="tree-shell" aria-label="PMH Literacy Tree">
      <div class="tree-headline disciplinary">Disciplinary Literacy</div>

      <div class="tree-stage">
        <svg class="tree-svg" viewBox="0 0 1200 900" role="img" aria-label="Interactive literacy tree">
          <defs>
            <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#72533d"/>
              <stop offset=".45" stop-color="#9c7656"/>
              <stop offset=".7" stop-color="#7c5b43"/>
              <stop offset="1" stop-color="#604432"/>
            </linearGradient>
            <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5b7d59"/>
              <stop offset="1" stop-color="#294d3d"/>
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#163a2d" flood-opacity=".16"/>
            </filter>
          </defs>

          <g class="canopy" filter="url(#softShadow)">
            <path d="M252 420 C224 365 243 310 292 282 C277 230 324 191 377 198 C398 142 461 127 507 159 C548 111 620 116 652 162 C704 125 772 151 786 207 C850 194 899 241 888 295 C938 326 938 388 900 421 C875 483 809 515 744 498 C702 542 637 542 596 512 C550 545 478 540 447 502 C380 520 308 489 287 442 C270 441 259 432 252 420 Z" fill="url(#leaf)"/>

            <g opacity=".52" fill="#76926b">
              <ellipse cx="350" cy="273" rx="66" ry="42" transform="rotate(-24 350 273)"/>
              <ellipse cx="446" cy="222" rx="75" ry="43" transform="rotate(16 446 222)"/>
              <ellipse cx="562" cy="193" rx="78" ry="45" transform="rotate(-8 562 193)"/>
              <ellipse cx="686" cy="211" rx="75" ry="44" transform="rotate(18 686 211)"/>
              <ellipse cx="792" cy="282" rx="72" ry="45" transform="rotate(-18 792 282)"/>
              <ellipse cx="337" cy="394" rx="70" ry="44" transform="rotate(18 337 394)"/>
              <ellipse cx="476" cy="399" rx="78" ry="46" transform="rotate(-12 476 399)"/>
              <ellipse cx="625" cy="397" rx="84" ry="49" transform="rotate(10 625 397)"/>
              <ellipse cx="773" cy="405" rx="72" ry="44" transform="rotate(-14 773 405)"/>
            </g>

            <g opacity=".4" stroke="#193f31" stroke-width="3" fill="none">
              <path d="M330 318 Q455 255 594 280 Q720 304 835 340"/>
              <path d="M327 419 Q442 352 585 369 Q721 385 831 432"/>
              <path d="M425 210 Q506 276 548 380"/>
              <path d="M710 211 Q655 277 626 382"/>
            </g>
          </g>

          <g class="branches" stroke="url(#trunk)" fill="none" stroke-linecap="round">
            <path d="M597 705 C591 620 590 536 600 450 C604 394 606 336 608 280" stroke-width="46"/>
            <path d="M600 494 C539 454 488 415 444 356" stroke-width="22"/>
            <path d="M608 470 C665 429 711 389 758 326" stroke-width="21"/>
            <path d="M602 410 C568 372 543 333 522 286" stroke-width="16"/>
            <path d="M610 393 C640 349 660 313 678 267" stroke-width="15"/>
          </g>

          <g class="roots" fill="none" stroke="#876247" stroke-linecap="round">
            <path d="M594 687 C520 717 422 754 291 783" stroke-width="18"/>
            <path d="M606 693 C544 751 510 810 459 852" stroke-width="15"/>
            <path d="M616 694 C618 761 620 812 618 866" stroke-width="17"/>
            <path d="M624 692 C682 749 727 807 819 849" stroke-width="15"/>
            <path d="M630 684 C744 716 851 755 965 790" stroke-width="18"/>
            <path d="M575 705 C503 733 371 797 202 827" stroke-width="7" opacity=".65"/>
            <path d="M648 704 C746 748 902 797 1036 819" stroke-width="7" opacity=".65"/>
          </g>

          <g id="issueNodes"></g>
        </svg>
      </div>

      <div class="tree-headline foundational">Foundational Literacy</div>
    </section>
  </main>

  <script src="content.js"></script>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const group = document.getElementById('issueNodes');

    literacyIssues.forEach(issue => {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', `issue-node ${issue.type}`);
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'link');
      g.setAttribute('aria-label', issue.title);
      g.addEventListener('click', () => location.href = `issue.html?id=${issue.slug}`);
      g.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') location.href = `issue.html?id=${issue.slug}`;
      });

      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', issue.x);
      circle.setAttribute('cy', issue.y);
      circle.setAttribute('r', '8');

      const width = Math.max(124, issue.title.length * 8 + 24);
      const yOffset = issue.type === 'foundational' ? -10 : -39;

      const labelBg = document.createElementNS(NS, 'rect');
      labelBg.setAttribute('x', issue.x - width / 2);
      labelBg.setAttribute('y', issue.y + yOffset);
      labelBg.setAttribute('width', width);
      labelBg.setAttribute('height', 28);
      labelBg.setAttribute('rx', 4);

      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', issue.x);
      text.setAttribute('y', issue.y + yOffset + 19);
      text.setAttribute('text-anchor', 'middle');
      text.textContent = issue.title;

      g.append(labelBg, text, circle);
      group.appendChild(g);
    });
  </script>
</body>
</html>
